<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrat PRO FINAL</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
}

*{box-sizing:border-box;}

.container{
max-width:850px;
margin:40px auto;
background:white;
padding:40px;
border-radius:10px;
position:relative;
}

/* HEADER */
.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
}

.logo-box{
width:90px;
height:90px;
border-radius:10px;
border:2px solid gold;
overflow:hidden;
cursor:pointer;
background:white;
}

.logo-box img{
width:100%;
height:100%;
object-fit:cover;
}

.title{
flex:1;
text-align:center;
font-size:22px;
font-weight:bold;
color:gold;
}

label{
font-weight:bold;
display:block;
margin-top:10px;
}

input, select{
width:100%;
padding:8px;
margin-top:5px;
border-radius:5px;
border:1px solid #ccc;
}

/* TEXT */
.text{
margin-top:20px;
line-height:1.6;
}

/* SIGNATURES */
.signatures{
margin-top:90px;
display:flex;
justify-content:space-between;
gap:40px;
}

.sig{
width:45%;
text-align:center;
position:relative;
padding-top:60px;
}

.sig-right{
width:45%;
text-align:center;
}

/* SIGNATURE LINE */
.line{
border-top:2px solid black;
margin-top:15px;
padding-top:5px;
font-family:cursive;
font-size:18px;
outline:none;
}

/* STAMP */
.stamp-overlay{
position:absolute;
top:-20px;
left:50%;
transform:translateX(-50%) rotate(-3deg);
z-index:10;
}

.stamp-box{
width:165px;
border:3px solid red;
padding:10px;
text-align:center;
background:white;
color:red;
font-weight:bold;
font-size:11px;
box-shadow:0 3px 10px rgba(0,0,0,0.25);
border-radius:8px;
position:relative;
}

.stamp-box::before{
content:"";
position:absolute;
top:6px;
left:6px;
right:6px;
bottom:6px;
border:1px solid red;
border-radius:6px;
opacity:0.6;
pointer-events:none;
}

.stamp-edit{
outline:none;
display:block;
cursor:text;
font-size:11px;
font-weight:bold;
color:red;
}

.st-mid{
font-size:18px;
margin:5px 0;
}

/* BUTTON */
button{
margin-top:25px;
width:100%;
padding:12px;
background:gold;
border:none;
border-radius:5px;
font-weight:bold;
cursor:pointer;
}

/* POPUP */
#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
}

.popup-box{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
}
</style>

</head>

<body>

<div class="container" id="contrat">

<!-- HEADER -->
<div class="header">

<div class="logo-box" onclick="logoInput.click()">
<img id="logoPreview" src="https://via.placeholder.com/90">
<input type="file" id="logoInput" hidden>
</div>

<div class="title">CONTRAT DE TRAVAIL</div>

<div style="width:90px;"></div>
</div>

<!-- FORM -->
<label>Nom entreprise</label>
<div contenteditable="true">Lesfacilitateurs Groupe</div>

<label>Nom employé / client</label>
<input placeholder="Nom complet">

<label>Poste / tâche</label>
<input value="Chargé(e) de mission">

<label>Type de contrat</label>
<select>
<option>CDI</option>
<option>CDD</option>
<option>Stage</option>
<option>Tâcheron</option>
<option>Consultant</option>
</select>

<label>Date début</label>
<input type="date">

<label>Date fin</label>
<input type="date">

<label>Salaire</label>
<input value="150 000 FCFA">

<label>Avance</label>
<input value="150 000 FCFA">

<label>Reste</label>
<input value="150 000 FCFA">

<div class="text">
<p>Ce contrat engage les deux parties selon les lois en vigueur.</p>
</div>

<!-- SIGNATURES -->
<div class="signatures">

<div class="sig">
<div class="line" contenteditable="true">Lesfacilitateurs Groupe</div>
<small>Signature entreprise</small>

<div class="stamp-overlay">
<div class="stamp-box">
<div class="stamp-edit" contenteditable="true">
ETS LESFACILITATEURS GROUPE
</div>
<div class="st-mid">★</div>
<div class="stamp-edit" contenteditable="true">
YAOUNDÉ • +237 670 035 609
</div>
</div>
</div>

</div>

<div class="sig-right">
<div class="line" contenteditable="true">
Signature Employé / Client
</div>
<small>Signature employé</small>
</div>

</div>

<button onclick="openPopup()" id="btnPdf">📄 Télécharger PDF</button>

</div>

<!-- POPUP -->
<div id="popup">
<div class="popup-box">
<h3>Code d'accès</h3>
<input type="password" id="code">
<br><br>
<button onclick="check()">Valider</button>
<p id="err" style="color:red;"></p>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>

/* LOGO */
document.getElementById("logoInput").addEventListener("change", e=>{
let file=e.target.files[0];
if(file){
let reader=new FileReader();
reader.onload=ev=>document.getElementById("logoPreview").src=ev.target.result;
reader.readAsDataURL(file);
}
});

/* OPEN POPUP */
function openPopup(){
document.getElementById("popup").style.display="flex";
document.getElementById("err").innerText="";
document.getElementById("code").value="";
}

/* CHECK CODE */
function check(){
if(document.getElementById("code").value==="233"){
document.getElementById("popup").style.display="none";
downloadPDF();
}else{
document.getElementById("err").innerText="Code incorrect";
}
}

/* PDF */
function downloadPDF(){

let btn=document.getElementById("btnPdf");
btn.innerText="Génération...";
btn.disabled=true;

const element=document.getElementById("contrat");

html2pdf().set({
margin:[10,10,12,10],
filename:'contrat.pdf',
image:{type:'jpeg',quality:0.95},
html2canvas:{
scale:1.5,
useCORS:true,
scrollY:0
},
jsPDF:{
unit:'mm',
format:'a4',
orientation:'portrait'
}
}).from(element).save()
.then(()=>{
btn.innerText="📄 Télécharger PDF";
btn.disabled=false;
});
}

</script>

</body>
</html>
